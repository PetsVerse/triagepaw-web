<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Account Deletion | TriagePaw</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6JN2YMLJD6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6JN2YMLJD6');
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {
            --teal: #008080;
            --teal-dark: #006666;
            --teal-light: #e6f7f7;
            --teal-border: rgba(0, 128, 128, 0.3);
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, var(--teal-light) 0%, #fff 40%);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 480px;
            width: 100%;
        }
        header {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-wrap {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }
        .logo-wrap img { height: 40px; width: 40px; border-radius: 12px; }
        .logo-wrap span { font-size: 1.25rem; font-weight: 600; color: var(--teal); }
        h1 {
            color: var(--teal);
            font-size: clamp(1.5rem, 4vw, 1.75rem);
            margin: 0 0 8px 0;
            font-weight: 600;
        }
        .subtitle {
            color: #555;
            font-size: 0.95rem;
            margin: 0;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            border: 1px solid var(--teal-border);
            box-shadow: 0 4px 24px rgba(0, 128, 128, 0.08);
            padding: 32px;
            text-align: center;
        }
        .status-icon {
            font-size: 2.5rem;
            margin-bottom: 16px;
        }
        .status-icon.loading { color: var(--teal); }
        .status-icon.success { color: var(--teal); }
        .status-icon.error { color: #991b1b; }
        .status-text {
            font-size: 1rem;
            line-height: 1.6;
        }
        .status-text.success { color: var(--teal-dark); }
        .status-text.error { color: #991b1b; }
        .status-text.loading { color: #555; }
        .footer-links {
            margin-top: 24px;
            text-align: center;
        }
        .footer-links a {
            color: var(--teal);
            font-weight: 600;
            text-decoration: none;
        }
        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-wrap">
                <img src="assets/triagepaw-icon.png" alt="TriagePaw">
                <span>TriagePaw</span>
            </div>
            <h1>Confirm Account Deletion</h1>
            <p class="subtitle">Verifying your confirmation link…</p>
        </header>

        <div class="card">
            <div id="status-icon" class="status-icon loading" aria-hidden="true">
                <i class="fa-solid fa-spinner fa-spin"></i>
            </div>
            <p id="status-text" class="status-text loading" role="alert" aria-live="polite">
                Please wait while we confirm your request…
            </p>
        </div>

        <div class="footer-links">
            <a href="index.html">Back to home</a>
            <span aria-hidden="true"> · </span>
            <a href="mailto:contact@triagepaw.com">Contact us</a>
        </div>
    </div>

    <script>
        (function () {
            var FUNCTION_URL = 'https://gafpoukivhtbcalceeqb.supabase.co/functions/v1/delete-request-confirm';

            var iconEl = document.getElementById('status-icon');
            var textEl = document.getElementById('status-text');
            var subtitle = document.querySelector('.subtitle');

            function setSuccess(msg) {
                subtitle.textContent = 'Request confirmed';
                iconEl.className = 'status-icon success';
                iconEl.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
                textEl.className = 'status-text success';
                textEl.textContent = msg;
            }

            function setError(msg) {
                subtitle.textContent = 'Something went wrong';
                iconEl.className = 'status-icon error';
                iconEl.innerHTML = '<i class="fa-solid fa-circle-xmark"></i>';
                textEl.className = 'status-text error';
                textEl.textContent = msg;
            }

            var params = new URLSearchParams(window.location.search);
            var token = params.get('token');

            if (!token) {
                setError('Invalid or missing confirmation link.');
                return;
            }

            fetch(FUNCTION_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token })
            })
                .then(function (res) {
                    return res.json().then(function (data) {
                        if (!res.ok) throw new Error(data.message || data.error || 'Request failed');
                        return data;
                    });
                })
                .then(function () {
                    setSuccess('Your deletion request has been confirmed. We will process it shortly and notify you by email.');
                })
                .catch(function () {
                    setError('This confirmation link is invalid or has already been used.');
                });
        })();
    </script>
</body>
</html>

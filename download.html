<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download TriagePaw</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0F6E56;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    img { width: 80px; height: 80px; border-radius: 18px; margin-bottom: 24px; }
    p { color: white; font-size: 16px; margin-bottom: 24px; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fallback { margin-top: 32px; text-align: center; display: none; }
    .fallback a { color: white; display: block; margin-bottom: 12px; font-size: 15px; }
    noscript .fallback { display: block; }
  </style>
</head>
<body>
  <img src="/assets/triagepaw-icon.png" alt="TriagePaw" />
  <p>A redirecionar para a loja...</p>
  <div class="spinner"></div>
  <noscript>
    <div class="fallback">
      <a href="https://apps.apple.com/us/app/triage-paw-ai-pet-triage/id6758516514">Download on the App Store</a>
      <a href="https://play.google.com/store/apps/details?id=com.akiraprt.triagepaw">Get it on Google Play</a>
    </div>
  </noscript>
  <script>
    var ua = navigator.userAgent;
    if (/iPhone|iPad|iPod/i.test(ua)) {
      window.location.replace('https://apps.apple.com/us/app/triage-paw-ai-pet-triage/id6758516514');
    } else if (/Android/i.test(ua)) {
      window.location.replace('https://play.google.com/store/apps/details?id=com.akiraprt.triagepaw');
    } else {
      window.location.replace('https://triagepaw.com');
    }
  </script>
</body>
</html>

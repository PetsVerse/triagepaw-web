<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Account | TriagePaw</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {
            --teal: #008080;
            --teal-dark: #006666;
            --teal-light: #e6f7f7;
            --teal-border: rgba(0, 128, 128, 0.3);
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, var(--teal-light) 0%, #fff 40%);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 480px;
            width: 100%;
        }
        header {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-wrap {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }
        .logo-wrap img { height: 40px; width: 40px; border-radius: 12px; }
        .logo-wrap span { font-size: 1.25rem; font-weight: 600; color: var(--teal); }
        h1 {
            color: var(--teal);
            font-size: clamp(1.5rem, 4vw, 1.75rem);
            margin: 0 0 8px 0;
            font-weight: 600;
        }
        .subtitle {
            color: #555;
            font-size: 0.95rem;
            margin: 0;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            border: 1px solid var(--teal-border);
            box-shadow: 0 4px 24px rgba(0, 128, 128, 0.08);
            padding: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        input[type="email"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid var(--teal-border);
            border-radius: 10px;
            color: #333;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="email"]:focus {
            outline: none;
            border-color: var(--teal);
            box-shadow: 0 0 0 3px rgba(0, 128, 128, 0.15);
        }
        input[type="email"]::placeholder {
            color: #999;
        }
        .btn {
            width: 100%;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.05s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: var(--teal);
            color: #fff;
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--teal-dark);
        }
        .btn-primary:active:not(:disabled) { transform: scale(0.99); }
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .message {
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }
        .message.show { display: block; }
        .message.success {
            background: var(--teal-light);
            border: 1px solid var(--teal-border);
            color: var(--teal-dark);
        }
        .message.error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }
        .footer-links {
            margin-top: 24px;
            text-align: center;
        }
        .footer-links a {
            color: var(--teal);
            font-weight: 600;
            text-decoration: none;
        }
        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-wrap">
                <img src="assets/triagepaw-icon.png" alt="TriagePaw">
                <span>TriagePaw</span>
            </div>
            <h1>Delete Account</h1>
            <p class="subtitle">Request account deletion. We’ll process it and confirm by email.</p>
        </header>

        <div class="card">
            <div id="message" class="message" role="alert" aria-live="polite"></div>

            <form id="deletion-form" novalidate>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                        autocomplete="email"
                    >
                </div>
                <button type="submit" class="btn btn-primary" id="submit-btn">
                    <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                    Send deletion request
                </button>
            </form>
        </div>

        <div class="footer-links">
            <a href="index.html">Back to home</a>
            <span aria-hidden="true"> · </span>
            <a href="mailto:contact@triagepaw.com">Contact us</a>
        </div>
    </div>

    <script>
        (function () {
            // Replace with your Supabase project URL, e.g. https://abcdefgh.supabase.co
            var SUPABASE_URL = 'https://gafpoukivhtbcalceeqb.supabase.co/functions/v1/delete-request';
            var FUNCTION_PATH = '/functions/v1/delete-request';

            var form = document.getElementById('deletion-form');
            var messageEl = document.getElementById('message');
            var submitBtn = document.getElementById('submit-btn');

            function showMessage(text, isError) {
                messageEl.textContent = text;
                messageEl.className = 'message show ' + (isError ? 'error' : 'success');
            }

            function hideMessage() {
                messageEl.className = 'message';
                messageEl.textContent = '';
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                hideMessage();

                var emailInput = document.getElementById('email');
                var email = (emailInput.value || '').trim();
                if (!email) {
                    showMessage('Please enter your email address.', true);
                    emailInput.focus();
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> Sending…';

                fetch(SUPABASE_URL + FUNCTION_PATH, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                })
                    .then(function (res) {
                        return res.json().then(function (data) {
                            if (!res.ok) throw new Error(data.message || data.error || 'Request failed');
                            return data;
                        });
                    })
                    .then(function (data) {
                        showMessage('Request sent. We’ll process your deletion and confirm by email.', false);
                        form.reset();
                    })
                    .catch(function (err) {
                        showMessage(err.message || 'Something went wrong. Please try again or contact us.', true);
                    })
                    .finally(function () {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Send deletion request';
                    });
            });
        })();
    </script>
</body>
</html>
